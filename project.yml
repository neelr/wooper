name: Wooper
options:
  bundleIdPrefix: com.neelr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: UC63C5M72P

targets:
  Wooper:
    type: application
    platform: iOS
    sources:
      - path: Wooper
        excludes:
          - "Secrets.example.swift"
      - path: Vendor/melonds/src/libretro/libretro-common/compat/compat_strl.c
      - path: Vendor/melonds/src/libretro/libretro-common/compat/fopen_utf8.c
      - path: Vendor/melonds/src/libretro/libretro-common/compat/compat_posix_string.c
      - path: Vendor/melonds/src/libretro/libretro-common/compat/compat_strcasestr.c
      - path: Vendor/melonds/src/libretro/libretro-common/encodings/encoding_utf.c
      - path: Vendor/melonds/src/libretro/libretro-common/file/file_path.c
      - path: Vendor/melonds/src/libretro/libretro-common/streams/file_stream.c
      - path: Vendor/melonds/src/libretro/libretro-common/streams/file_stream_transforms.c
      - path: Vendor/melonds/src/libretro/libretro-common/string/stdstring.c
      - path: Vendor/melonds/src/libretro/libretro-common/vfs/vfs_implementation.c
      - path: DSCore
        excludes:
          - "*.a"
          - "MELONDS-LICENSE"
      - path: Shared
      - path: PaperyShared
        excludes:
          - "PaperyConfig.example.swift"
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: DSCore/DSCore.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/melonds/src/libretro/libretro-common/include"
        OTHER_LDFLAGS: "$(inherited) $(SRCROOT)/DSCore/libmelonds.a -lc++"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Wooper needs microphone access to record voice memos."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Wooper syncs your papery reading list to your e-reader over Bluetooth."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Wooper transcribes your voice memos to save to Notion."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_CFBundleDisplayName: "wooper"
        PRODUCT_BUNDLE_IDENTIFIER: com.neelr.Wooper
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Wooper/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
          - bluetooth-central
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.neelr.Wooper.lensrefresh
        NSAppTransportSecurity:
          NSExceptionDomains:
            tail90f369.ts.net:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    entitlements:
      path: Wooper/Wooper.entitlements
      properties:
        aps-environment: development
    dependencies:
      - target: RecordingActivity
      - target: PaperyShare

  PaperyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PaperyShare
      - path: PaperyShared
        excludes:
          - "PaperyConfig.example.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neelr.Wooper.PaperyShare
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Save to Papery"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: PaperyShare/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Save to Papery"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    dependencies: []

  RecordingActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: RecordingActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neelr.Wooper.RecordingActivity
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: RecordingActivity/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies: []
