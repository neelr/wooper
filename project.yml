name: Wooper
options:
  bundleIdPrefix: com.neelr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: UT9BBXAFRT

targets:
  Wooper:
    type: application
    platform: iOS
    sources:
      - path: Wooper
        excludes:
          - "Secrets.example.swift"
      - path: Shared
    settings:
      base:
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Wooper needs microphone access to record voice memos."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Wooper transcribes your voice memos to save to Notion."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_CFBundleDisplayName: "wooper"
        PRODUCT_BUNDLE_IDENTIFIER: com.neelr.Wooper
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Wooper/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIBackgroundModes:
          - audio
    entitlements:
      path: Wooper/Wooper.entitlements
    dependencies:
      - target: RecordingActivity

  RecordingActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: RecordingActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neelr.Wooper.RecordingActivity
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: RecordingActivity/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies: []
